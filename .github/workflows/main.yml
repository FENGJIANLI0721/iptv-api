name: "Update IPTV list"

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests --quiet
      - run: python .github/scripts/merge_sources.py
      - run: |
          git config --local user.email "bot@users.noreply.github.com"
          git config --local user.name "bot"
          git add output/result.m3u
          if ! git diff --staged --quiet; then
            git commit -m "Auto update"
            git push
          fi
